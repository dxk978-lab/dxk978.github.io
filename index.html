<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pepper Tier Lab</title>

<style>
:root{
  --bg:#fff7ed;
  --ink:#24170f;
  --muted:#765f52;
  --card:#ffffff;
  --line:#ead9ca;
  --accent:#f97316;
  --accent2:#ef4444;

  --tierF:#8b5cf6;
  --tierD:#3b82f6;
  --tierC:#06b6d4;
  --tierB:#22c55e;
  --tierA:#eab308;
  --tierS:#ef4444;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,
    "Segoe UI",sans-serif;

  background:
    radial-gradient(circle at 10% 0%,#fed7aa 0,transparent 28%),
    radial-gradient(circle at 90% 10%,#fecaca 0,transparent 25%),
    var(--bg);

  color:var(--ink);
}

button{
  font:inherit;
}

.app{
  max-width:1100px;
  margin:auto;
  padding:28px 18px 44px;
}

/* Header */

header{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:end;
  margin-bottom:22px;
}

.brand h1{
  font-size:clamp(2rem,5vw,3.5rem);
  line-height:.95;
  margin:0;
  font-weight:900;
  letter-spacing:-.05em;
}

.brand p{
  margin:10px 0 0;
  color:var(--muted);
  font-weight:600;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

button.action{
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
  transition:.15s ease;
}

button.action:hover{
  filter:brightness(.97);
  transform:translateY(-1px);
}

button.action.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

/* Tier board */

.board{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.tier{
  display:grid;
  grid-template-columns:76px 1fr;
  min-height:86px;

  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;

  background:#fff;
  box-shadow:0 5px 18px #6b3a1610;

  transition:.15s ease;
}

.tier.dragover{
  transform:scale(1.01);
}

.label{
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:1.7rem;
  font-weight:1000;
  color:#fff;
}

.zone{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;

  padding:10px;
  min-height:86px;

  background:#fff;
  transition:.15s ease;
}

.tier.dragover .zone{
  background:#fff3e8;
  outline:3px dashed var(--accent);
  outline-offset:-5px;
}

/* Tier colors */

.tier-F .label{
  background:var(--tierF);
}

.tier-D .label{
  background:var(--tierD);
}

.tier-C .label{
  background:var(--tierC);
}

.tier-B .label{
  background:var(--tierB);
}

.tier-A .label{
  background:var(--tierA);
}

.tier-S .label{
  background:var(--tierS);
}

/* Pepper pile */

.pool{
  margin-top:20px;
  padding:18px;

  border:1px solid var(--line);
  border-radius:18px;

  background:#ffffffb8;
}

.pool-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;

  margin-bottom:12px;
}

.pool h2{
  margin:0;
  font-size:1.15rem;
}

.hint{
  font-size:.9rem;
  color:var(--muted);
}

.items{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  min-height:74px;
}

/* Pepper cards */

.pepper{
  user-select:none;
  cursor:grab;

  border:1px solid #ead9ca;
  background:#fff;
  border-radius:14px;

  padding:10px 12px;

  display:flex;
  align-items:center;
  gap:9px;

  box-shadow:0 4px 10px #6b3a1612;

  font-weight:800;

  touch-action:none;

  transition:
    transform .12s ease,
    box-shadow .12s ease,
    opacity .12s ease;
}

.pepper:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 15px #6b3a1620;
}

.pepper:active{
  cursor:grabbing;
}

.pepper.dragging{
  opacity:.45;
}

.emoji{
  font-size:1.5rem;
}

.name{
  line-height:1.1;
}

.heat{
  display:block;
  font-size:.7rem;
  color:var(--muted);
  font-weight:700;
  margin-top:3px;
}

.empty{
  color:#a48d7d;
  font-weight:700;
  padding:12px;
}

/* David Klochko attribution footer */
.site-footer{
  margin-top:32px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  border-top:1px solid var(--line);
  color:var(--muted);
}

.footer-photo{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:50%;
  overflow:hidden;
  background:#fff;
  border:2px solid var(--accent);
  box-shadow:0 4px 12px #6b3a1618;
}

.footer-photo img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.footer-text{
  display:flex;
  flex-direction:column;
  gap:3px;
  text-align:left;
}

.footer-text strong{
  color:var(--ink);
  font-size:.95rem;
}

.footer-text span{
  font-size:.82rem;
}

/* Mobile */

@media(max-width:650px){

  header{
    align-items:start;
    flex-direction:column;
  }

  .tier{
    grid-template-columns:58px 1fr;
  }

  .label{
    font-size:1.35rem;
  }

  .pepper{
    padding:9px;
  }

  .hint{
    display:none;
  }
}

/* Print/export */

@media print{

  body{
    background:#fff;
  }

  .actions,
  .pool{
    display:none;
  }

  .app{
    max-width:none;
    padding:0;
  }

  .tier{
    break-inside:avoid;
    box-shadow:none;
    margin-bottom:7px;
  }
}
</style>
</head>

  function saveState(){

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );

  }


  /*
   * Create a draggable pepper card.
   */

  function createPepperElement(pepper){

    const element =
      document.createElement("div");

    element.className = "pepper";

    element.draggable = true;

    element.dataset.id = pepper[0];


    element.innerHTML = `

      <span class="emoji">
        ${pepper[1]}
      </span>

      <span class="name">

        ${pepper[2]}

        <span class="heat">
          ${pepper[3]}
        </span>

      </span>

    `;


    /*
     * When dragging starts,
     * store the pepper ID inside
     * the browser's drag data.
     */

    element.addEventListener(
      "dragstart",
      event => {

        event.dataTransfer.setData(
          "text/plain",
          pepper[0]
        );

        element.classList.add(
          "dragging"
        );

      }
    );


    element.addEventListener(
      "dragend",
      () => {

        element.classList.remove(
          "dragging"
        );

      }
    );


    return element;

  }


  /*
   * Draw the complete board
   * based on the saved state.
   */

  function render(){

    /*
     * Clear current contents.
     */

    pool.innerHTML = "";

    tiers.forEach(tier => {

      tier
        .querySelector(".zone")
        .innerHTML = "";

    });


    const ranked =
      new Set();


    /*
     * Place every pepper either:
     *
     * 1. inside its saved tier
     * 2. inside the unranked pepper pile
     */

    peppers.forEach(pepper => {

      const savedTier =
        state.placements[pepper[0]];


      const tierElement =
        document.querySelector(
          `[data-tier="${savedTier}"]`
        );


      if(savedTier && tierElement){

        tierElement
          .querySelector(".zone")
          .appendChild(
            createPepperElement(pepper)
          );

        ranked.add(pepper[0]);

      }else{

        pool.appendChild(
          createPepperElement(pepper)
        );

      }

    });


    /*
     * Update ranked count.
     */

    count.textContent =
      `${ranked.size}/${peppers.length} ranked`;


    bindDropTargets();

  }


  /*
   * Enable dropping on all tiers
   * and on the unranked pepper pile.
   */

  function bindDropTargets(){

    const dropZones = [

      ...document.querySelectorAll(".zone"),

      pool

    ];


    dropZones.forEach(zone => {


      zone.addEventListener(
        "dragover",
        event => {

          event.preventDefault();

          const tier =
            zone.closest(".tier");

          if(tier){

            tier.classList.add(
              "dragover"
            );

          }

        }
      );


      zone.addEventListener(
        "dragleave",
        () => {

          const tier =
            zone.closest(".tier");

          if(tier){

            tier.classList.remove(
              "dragover"
            );

          }

        }
      );


      zone.addEventListener(
        "drop",
        event => {

          event.preventDefault();


          const tier =
            zone.closest(".tier");


          if(tier){

            tier.classList.remove(
              "dragover"
            );

          }


          /*
           * Retrieve the pepper ID
           * from the drag operation.
           */

          const pepperId =
            event.dataTransfer.getData(
              "text/plain"
            );


          if(!pepperId){

            return;

          }


          /*
           * If dropped onto a tier,
           * save that tier.
           *
           * If dropped onto the pepper pile,
           * remove its tier assignment.
           */

          if(tier){

            state.placements[pepperId] =
              tier.dataset.tier;

          }else{

            delete state.placements[
              pepperId
            ];

          }


          saveState();

          render();

        }
      );

    });

  }


  /*
   * Reset button.
   */

  document
    .getElementById("resetBtn")
    .addEventListener(
      "click",
      () => {

        const confirmed =
          confirm(
            "Reset all pepper placements?"
          );


        if(!confirmed){

          return;

        }


        state = {
          placements:{}
        };


        saveState();

        render();

      }
    );


  /*
   * Export button.
   *
   * Uses the browser's native print dialog.
   * Users can choose "Save as PDF"
   * or print the completed tier list.
   */

  document
    .getElementById("exportBtn")
    .addEventListener(
      "click",
      () => {

        window.print();

      }
    );


  /*
   * Initial render.
   */

  render();

})();

</script>

</body>
</html>
